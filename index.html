<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>あおナースくん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-height stage showing the avatar canvas, slim control dock at the bottom */
:root{
  --ink:#1f2a44; --muted:#5b6886; --dock:#ffffffee; --line:#d6ddef;
  --accent:#2c4fb8; --accent-ink:#ffffff;
  --stage-a:#eef2fb; --stage-b:#d9e1f4; --grid:#c8d3ee;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e4e9f7; --muted:#9aa6c4; --dock:#151b2cee; --line:#2a3350;
  --accent:#7d9bf0; --accent-ink:#0c1226;
  --stage-a:#1d2540; --stage-b:#121829; --grid:#222c4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e4e9f7; --muted:#9aa6c4; --dock:#151b2cee; --line:#2a3350;
  --accent:#7d9bf0; --accent-ink:#0c1226;
  --stage-a:#1d2540; --stage-b:#121829; --grid:#222c4a; color-scheme:dark}
html,body{height:100%}
body{background:var(--stage-b);color:var(--ink);font-family:var(--font);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background-color:var(--stage-b);
  background-image:radial-gradient(circle at 50% 38%, var(--stage-a) 0 38%, transparent 72%),
    repeating-linear-gradient(0deg, transparent 0 58px, var(--grid) 58px 60px),
    repeating-linear-gradient(90deg, transparent 0 58px, var(--grid) 58px 60px)}
.stage.green{background:#00b140}
.stage.plain{background-image:radial-gradient(circle at 50% 38%, var(--stage-a) 0 38%, transparent 72%)}
canvas{height:98%;max-width:100%;object-fit:contain;display:block}
.dock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--dock);border-top:1px solid var(--line)}
.dock h1{font-size:15px;font-weight:800;margin:0 8px 0 0}
button{font:inherit;font-size:13px;font-weight:800;border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:8px 12px;border-radius:999px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{flex-basis:100%;font-size:12px;color:var(--muted);min-height:1.2em}
.faces{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.faces button{padding:6px 10px;font-size:12px}
body.clean .dock{display:none}
video{display:none}
</style>

<div class="app">
  <div class="stage" id="stage"><canvas id="cv" width="1090" height="1000" aria-label="青髪の看護師アバター"></canvas></div>
  <div class="dock">
    <h1>あおナースくん</h1>
    <button class="primary" id="camBtn" type="button">カメラで動かす</button>
    <button id="micBtn" type="button" aria-pressed="false">マイクで口パク</button>
    <button id="bgBtn" type="button">背景：ナースステーション</button>
    <button id="mirrorBtn" type="button" aria-pressed="true">左右反転</button>
    <button id="cleanBtn" type="button">UIを隠す（H）</button>
    <div class="faces" id="faces" role="group" aria-label="表情"></div>
    <div class="faces" id="hands" role="group" aria-label="手の動き"></div>
    <div class="status" id="status">デモ再生中。カメラを使うとあなたの顔に合わせて動きます。</div>
    <div class="status" id="keys">キー：1〜8 表情 ／ Q グッド・W どうぞ ／ Esc 元に戻す ／ H 操作パネルを隠す</div>
  </div>
  <video id="video" playsinline muted></video>
</div>

  const gazeBase={x:0,y:0}, blinkSt={L:0,R:0,bL:.15,bR:.15};
  let expr=EXPR[0], exprAt=0; const eyeCan={L:document.createElement('canvas'),R:document.createElement('canvas')}; const hair={x:0,v:0,prev:0};
  const facesEl=$('faces');
  EXPR.forEach((e,i)=>{const b=document.createElement('button'); b.type='button'; b.textContent=e.label;
    b.setAttribute('aria-pressed', i===0); b.addEventListener('click',()=>setExpr(i)); facesEl.appendChild(b);});
  function setExpr(i){ expr=(expr===EXPR[i] && i!==0)?EXPR[0]:EXPR[i]; exprAt=performance.now();
    [...facesEl.children].forEach((b,j)=>b.setAttribute('aria-pressed', EXPR[j]===expr)); }
  function drawFx(t){
    const age=(performance.now()-exprAt)/1000, pop=Math.min(1,age*6), fxs=expr.fx||[];
    if(fxs.includes('blush')){
      for(const [x,y] of [[262,478],[468,494]]){
        const g=ctx.createRadialGradient(x,y,4,x,y,46); g.addColorStop(0,'rgba(255,110,130,.55)'); g.addColorStop(1,'rgba(255,110,130,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,48,26,0,0,7); ctx.fill();
        ctx.strokeStyle='rgba(225,80,100,.55)'; ctx.lineWidth=3; ctx.lineCap='round';
        for(let k=-1;k<=1;k++){ctx.beginPath(); ctx.moveTo(x+k*14-5,y+6); ctx.lineTo(x+k*14+5,y-6); ctx.stroke();}
      }
    }
    if(fxs.includes('sweat')){
      const y=372+((t*40)%60), x=575;
      ctx.save(); ctx.globalAlpha=pop*(1-((t*40)%60)/80);
      ctx.fillStyle='#bfe6ff'; ctx.strokeStyle='#3a7bc8'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x,y-28); ctx.bezierCurveTo(x+16,y-6,x+18,y+12,x,y+14); ctx.bezierCurveTo(x-18,y+12,x-16,y-6,x,y-28); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(x-5,y+2,3,6,-.3,0,7); ctx.fill(); ctx.restore();
    }
    if(fxs.includes('anger')){
      const x=600,y=250,s=pop*(1+Math.sin(t*10)*.06);
      ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#e8343c'; ctx.lineWidth=9; ctx.lineCap='round';
      for(let k=0;k<4;k++){ctx.save(); ctx.rotate(k*Math.PI/2); ctx.beginPath(); ctx.moveTo(10,-30); ctx.quadraticCurveTo(10,-10,30,-10); ctx.stroke(); ctx.restore();}
      ctx.restore();
    }
    if(fxs.includes('bang')){
      ctx.save(); ctx.translate(610,250); ctx.rotate(.15); ctx.scale(pop,pop);
      ctx.fillStyle='#ffc21a'; ctx.strokeStyle='#8a4b00'; ctx.lineWidth=5;
      for(const dx of [-18,18]){ctx.beginPath(); ctx.moveTo(dx-9,-50); ctx.lineTo(dx+9,-50); ctx.lineTo(dx+4,10); ctx.lineTo(dx-4,10); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(dx,30,9,0,7); ctx.fill(); ctx.stroke();}
      ctx.restore();
    }
    if(fxs.includes('tears')){
      for(const [x,y,dir] of [[236,412,-1],[528,428,1]]){
        ctx.save(); ctx.fillStyle='rgba(200,235,255,.85)'; ctx.strokeStyle='rgba(70,140,210,.8)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.ellipse(x,y,9,4,0,0,7); ctx.fill(); ctx.stroke();
        for(let k=0;k<2;k++){ const p=((t*.7+k*.5)%1), yy=y+8+p*90;
          ctx.globalAlpha=(1-p)*pop; ctx.beginPath(); ctx.moveTo(x+dir*2,yy-12); ctx.bezierCurveTo(x+dir*2+8,yy,x+dir*2+7,yy+8,x+dir*2,yy+9); ctx.bezierCurveTo(x+dir*2-7,yy+8,x+dir*2-8,yy,x+dir*2,yy-12); ctx.fill(); ctx.stroke(); }
        ctx.restore();
      }
    }
    if(fxs.includes('star')){
      const x=585,y=360,s=pop*(1+Math.sin(t*8)*.12);
      ctx.save(); ctx.translate(x,y); ctx.rotate(t*.8); ctx.scale(s,s); ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.beginPath(); for(let k=0;k<10;k++){const r=k%2?9:22, a=k*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);} ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    if(fxs.includes('heart')){
      for(let k=0;k<3;k++){
        const p=((t*.5+k/3)%1), x=585+Math.sin((p+k)*6)*20+k*18, y=400-p*200, s=(.9+k*.2)*pop;
        ctx.save(); ctx.globalAlpha=1-p; ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#ff5c8a'; ctx.strokeStyle='#fff'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(0,14); ctx.bezierCurveTo(-34,-10,-14,-36,0,-18); ctx.bezierCurveTo(14,-36,34,-10,0,14); ctx.fill(); ctx.stroke(); ctx.restore();
      }
    }
  }
  const setStatus=t=>statusEl.textContent=t;

  function pickMouth(j,s){
    if(j<.12) return s>.6?'m_smile':'m_closed';
    if(j<.35) return 'o_small';
    if(j<.65) return s>.55?'o_smileOpen':'o_mid';
    return s>.55?'o_smileWide':'o_wide';
  }
  function demo(t){
    const now=performance.now();
    tgt.yaw=Math.sin(t*.45)*.2; tgt.pitch=Math.sin(t*.31)*.08; tgt.roll=Math.sin(t*.6)*.14+Math.sin(t*1.7)*.03;
    if(now>nextBlink){blinkUntil=now; nextBlink=now+2400+Math.random()*2800}
    const bt=now-blinkUntil; tgt.blink=bt<50?.5:bt<140?1:bt<200?.5:0; tgt.blinkL=tgt.blinkR=tgt.blink;
    if(now>nextGlance){const g=[[0,0],[0,0],[-10,0],[10,1],[-7,-3],[8,-2]][Math.floor(Math.random()*6)]; tgt.gx=g[0]; tgt.gy=g[1]; nextGlance=now+1200+Math.random()*2600;}
    if(now>nextTalk){talkUntil=now+1200+Math.random()*1800; nextTalk=talkUntil+900+Math.random()*2200}
    tgt.jaw=now<talkUntil?clamp(.4+.4*Math.sin(t*15)+.2*Math.sin(t*6.7)):0;
    tgt.smile=.45+.2*Math.sin(t*.4);
  }
  function readTracking(){
    const v=$('video');
    if(!landmarker||v.readyState<2||v.currentTime===lastT) return;
    lastT=v.currentTime;
    const r=landmarker.detectForVideo(v,performance.now());
    if(!r.faceBlendshapes||!r.faceBlendshapes.length) return;
    lastFaceAt=performance.now();
    const bs={}; r.faceBlendshapes[0].categories.forEach(c=>bs[c.categoryName]=c.score);
    // snap blinks to open/closed (with hysteresis) so the lids never park half-way
    // learn each eye's "open" level, then close when the score jumps well above it and reopen as soon as it falls back
    const snap=(v,sd)=>{
      if(!blinkSt[sd]) blinkSt['b'+sd]+=(v-blinkSt['b'+sd])*.03;
      const base=blinkSt['b'+sd], on=Math.min(.6,base+.28), off=Math.min(on-.05,base+.16);
      return blinkSt[sd] ? (v>off?1:0) : (v>on?1:0);
    };
    const bl=snap(bs.eyeBlinkLeft,'L'), br=snap(bs.eyeBlinkRight,'R');
    blinkSt.L=bl; blinkSt.R=br;
    tgt.blink=Math.max(bl,br);
    // screen-left eye is the avatar's right eye; in mirror mode it follows the user's right eye
    tgt.blinkL = mirror ? br : bl; tgt.blinkR = mirror ? bl : br;
    const gR=((bs.eyeLookOutRight||0)+(bs.eyeLookInLeft||0)-(bs.eyeLookInRight||0)-(bs.eyeLookOutLeft||0))/2;
    const gU=((bs.eyeLookUpLeft||0)+(bs.eyeLookUpRight||0)-(bs.eyeLookDownLeft||0)-(bs.eyeLookDownRight||0))/2;
    const rx=(mirror?-gR:gR)*22, ry=-gU*9;
    gazeBase.x+=(rx-gazeBase.x)*.002; gazeBase.y+=(ry-gazeBase.y)*.002;
    tgt.gx=clamp(rx-gazeBase.x,-10,10); tgt.gy=clamp(ry-gazeBase.y,-4,4);
    tgt.jaw=clamp((bs.jawOpen-.03)*2.2);
    tgt.smile=clamp(((bs.mouthSmileLeft||0)+(bs.mouthSmileRight||0))*.8);
    const mt=r.facialTransformationMatrixes&&r.facialTransformationMatrixes[0];
    if(mt){const m=mt.data,s=mirror?-1:1;
      tgt.pitch=Math.atan2(m[6],m[10]); tgt.yaw=Math.asin(clamp(-m[2],-1,1))*s; tgt.roll=Math.atan2(m[1],m[0])*s;}
  }
  function frame(ts){
    const t=ts/1000;
    if(tracking){
      readTracking();
      if(performance.now()-lastFaceAt>900){            // face lost (looking down at the stick, etc.): settle and keep blinking
        const keepJaw=tgt.jaw; demo(t); tgt.yaw*=.25; tgt.pitch*=.25; tgt.roll*=.25; tgt.jaw=keepJaw*.9;
      }
    } else demo(t);
    if(mic){
      const buf=mic.buf; mic.an.getFloatTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
      const rms=Math.sqrt(sum/buf.length);
      micFloor = rms<micFloor ? micFloor+(rms-micFloor)*.05 : micFloor+(rms-micFloor)*.0015;   // learns room noise
      const lv=clamp((rms-micFloor*1.8)/(.06*mic.gain));
      micJaw += (lv-micJaw)*(lv>micJaw?.6:.25);
      if(!tracking || performance.now()-lastFaceAt>900) tgt.jaw=micJaw; else tgt.jaw=Math.max(tgt.jaw,micJaw);
    }
    const k=tracking?.45:.25;
    for(const key in cur) cur[key]+=(tgt[key]-cur[key])*(key.startsWith('blink')?.9:key[0]==='g'?.35:k);
    const breath=reduce?0:Math.sin(t*1.6)*3;
    const yaw=clamp(cur.yaw,-.5,.5), pitch=clamp(cur.pitch,-.35,.35), roll=clamp(cur.roll,-.4,.4);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save(); ctx.translate(220,0);
    ctx.save();
    ctx.translate(435-yaw*12, 1000+breath);
    ctx.rotate(roll*.06);
    ctx.translate(-435,-1000);
    if(img.body.complete) ctx.drawImage(img.body,-220,0);
    // head: pivots on the neck
    const PV=[335,690], ha=clamp(roll*.55+yaw*.06,-.11,.11);
    ctx.save();
    ctx.translate(PV[0]-yaw*16, PV[1]+pitch*12-breath*.3);
    ctx.rotate(ha);
    ctx.scale(1-Math.abs(yaw)*.03,1);
    ctx.translate(-PV[0],-PV[1]);
    if(img.head_under.complete) ctx.drawImage(img.head_under,13,0);
    // eyes: white + moving iris clipped to the eye opening + lashes on top
    const GZ={"L": {"box": [226, 377], "iris": [253, 374], "c": [277, 398]}, "R": {"box": [431, 393], "iris": [446, 390], "c": [470, 414]}};
    for(const sd of ['L','R']){
      const g=GZ[sd], sc=img['sclera_'+sd], ir=img['iris_'+sd], op=img['open_'+sd], ov=img['eyeover_'+sd];
      if(!(sc.complete&&ir.complete&&op.complete&&ov.complete)) continue;
      ctx.drawImage(sc,g.box[0],g.box[1]);
      const oc=eyeCan[sd]; oc.width=op.naturalWidth; oc.height=op.naturalHeight; const o=oc.getContext('2d');
      const isc = expr.iris==='small' ? .82 : 1;
      const cx=g.c[0]-g.box[0]+cur.gx, cy=g.c[1]-g.box[1]+cur.gy;
      o.save(); o.translate(cx,cy); o.scale(isc,isc); o.drawImage(ir,g.iris[0]-g.c[0],g.iris[1]-g.c[1]); o.restore();
      if(expr.iris==='sparkle'||expr.iris==='wet'){
        o.fillStyle='rgba(255,255,255,.95)';
        o.beginPath(); o.arc(cx+7,cy-8,4.2,0,7); o.fill(); o.beginPath(); o.arc(cx-6,cy+7,2.4,0,7); o.fill();
        if(expr.iris==='wet'){ o.fillStyle='rgba(220,240,255,.55)'; o.beginPath(); o.ellipse(cx,cy+12,16,5,0,0,7); o.fill(); }
      }
      o.globalCompositeOperation='destination-in'; o.drawImage(op,0,0); o.globalCompositeOperation='source-over';
      ctx.drawImage(oc,g.box[0],g.box[1]);
      ctx.drawImage(ov,g.box[0],g.box[1]);
      if(expr.iris==='heart'){
        const p=1+Math.sin(t*6)*.08; ctx.save(); ctx.translate(g.c[0]+cur.gx,g.c[1]+cur.gy+1); ctx.scale(p*.95,p*.85);
        ctx.fillStyle='#ff3d84'; ctx.strokeStyle='#fff'; ctx.lineWidth=2.4; ctx.shadowColor='#ff9cc2'; ctx.shadowBlur=12;
        ctx.beginPath(); ctx.moveTo(0,13); ctx.bezierCurveTo(-26,-4,-12,-24,0,-10); ctx.bezierCurveTo(12,-24,26,-4,0,13); ctx.fill(); ctx.stroke();
        ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.ellipse(-8,-6,3.5,2.5,-.5,0,7); ctx.fill(); ctx.restore();
      }
    }
    // hair: roots stay put, tips sway and lag behind head motion
    const headX=-yaw*16+ha*120;
    hair.v += (-(headX-hair.prev)*7 - hair.x)*.12; hair.v*=.82; hair.x+=hair.v; hair.prev=headX;
    const hi=img.hair;
    if(hi.complete){
      const HW=hi.naturalWidth, HH=hi.naturalHeight, step=3;
      for(let y=0;y<HH;y+=step){
        const w=Math.pow(clamp((y-120)/430),1.3);
        const off=w*(hair.x + (reduce?0:2.4*Math.sin(t*1.9+y*.013) + 1.2*Math.sin(t*3.1+y*.03)));
        ctx.drawImage(hi,0,y,HW,Math.min(step+1,HH-y),13+off,0+y,HW,Math.min(step+1,HH-y));
      }
    }
    const SPLIT=179;
    for(const sd of ['L','R']){
      const b = sd==='L'?cur.blinkL:cur.blinkR, want = (sd==='R'&&expr.eyesR) || (sd==='L'&&expr.eyesL) || expr.eyes;
      let k = b>.75 ? (want==='happy'?'happy':'closed') : null;
      if(!k && want) k=want;
      if(!k && b>.3) k='half';
      const im=k&&img['eyes_'+k];
      if(!im||!im.complete) continue;
      const W2=im.naturalWidth, H2=im.naturalHeight;
      if(sd==='L') ctx.drawImage(im,0,0,SPLIT,H2,EYES[0],EYES[1],SPLIT,H2);
      else ctx.drawImage(im,SPLIT,0,W2-SPLIT,H2,EYES[0]+SPLIT,EYES[1],W2-SPLIT,H2);
    }
    const mk=(expr.mouth && cur.jaw<.25) ? expr.mouth : pickMouth(cur.jaw,cur.smile), m=img[mk];
    if(m&&m.complete&&mk[0]==='o'){ctx.drawImage(m,354-m.naturalWidth/2,547);}
    else if(m&&m.complete&&mk[0]==='x'){ctx.save(); ctx.translate(356,566); ctx.rotate(5*Math.PI/180); ctx.drawImage(m,-m.naturalWidth/2,-m.naturalHeight/2); ctx.restore();}
    else if(m&&m.complete){ctx.save(); ctx.translate(MOUTH_X,MOUTH_TOP+12); ctx.rotate(5*Math.PI/180); ctx.drawImage(m,-m.naturalWidth/2,-12); ctx.restore();}
    drawFx(t);
    ctx.restore();
    drawHand(t);
    ctx.restore();
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  async function startCamera(){
    const btn=$('camBtn');
    if(tracking){stopCamera();return;}
    btn.disabled=true; setStatus('カメラと顔トラッキングを準備しています…');
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
      const v=$('video'); v.srcObject=stream; await v.play();
      if(!landmarker){
        setStatus('顔トラッキングを読み込み中…（初回は数秒かかります）');
        const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
        const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
        landmarker=await vision.FaceLandmarker.createFromOptions(files,{
          baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},
          outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true,runningMode:'VIDEO',numFaces:1});
      }
      tracking=true; btn.textContent='カメラを止める';
      setStatus('トラッキング中。動きが左右逆なら「左右反転」を切り替えてください。');
    }catch(e){
      console.warn(e);
      setStatus('この画面ではカメラが使えません。ダウンロードしたHTMLをSafariかChromeで開くと動きます。');
    }finally{btn.disabled=false;}
  }
  function stopCamera(){
    const v=$('video'); if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null}
    tracking=false; $('camBtn').textContent='カメラで動かす'; setStatus('デモ再生中。');
  }
  $('camBtn').addEventListener('click',startCamera);
  $('micBtn').addEventListener('click',async e=>{
    const b=e.currentTarget;
    if(mic){ mic.stream.getTracks().forEach(t=>t.stop()); mic.ctx.close(); mic=null; micJaw=0; b.setAttribute('aria-pressed','false'); b.textContent='マイクで口パク'; return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      const ac=new (window.AudioContext||window.webkitAudioContext)();
      const src=ac.createMediaStreamSource(stream), an=ac.createAnalyser(); an.fftSize=1024;
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=.7;   // voice band, ignores clicks of the stick
      src.connect(bp); bp.connect(an);
      mic={stream,ctx:ac,an,buf:new Float32Array(an.fftSize),gain:1};
      b.setAttribute('aria-pressed','true'); b.textContent='マイクを止める';
      setStatus('マイク口パク中。声の大きさで口が動きます（カメラと併用OK）。');
    }catch(err){ console.warn(err); setStatus('マイクが使えません。ブラウザのマイク許可を確認してください。'); }
  });
  const bgs=[['','背景：ナースステーション'],['green','背景：グリーンバック'],['plain','背景：シンプル']];
  let bgi=0;
  $('bgBtn').addEventListener('click',()=>{
    if(bgs[bgi][0]) stage.classList.remove(bgs[bgi][0]);
    bgi=(bgi+1)%bgs.length; if(bgs[bgi][0]) stage.classList.add(bgs[bgi][0]);
    $('bgBtn').textContent=bgs[bgi][1];
  });
  $('mirrorBtn').addEventListener('click',e=>{mirror=!mirror;e.currentTarget.setAttribute('aria-pressed',mirror)});
  $('cleanBtn').addEventListener('click',()=>document.body.classList.add('clean'));
  stage.addEventListener('click',()=>document.body.classList.remove('clean'));
  addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H') document.body.classList.toggle('clean');
    const n=parseInt(e.key,10); if(n>=1&&n<=EXPR.length) setExpr(n-1); 
    const hi=HANDS.findIndex(h=>h.key===e.key.toLowerCase()); if(hi>=0) toggleHand(hi);
    if(e.key==='Escape'){ setExpr(0); if(handOn) toggleHand(HANDS.indexOf(hand)); }});
  // remember background and mirror per browser
  const save=()=>{ try{ localStorage.setItem('aonurse',JSON.stringify({bgi,mirror})); }catch(_){} };
  try{ const p=JSON.parse(localStorage.getItem('aonurse')||'null');
    if(p){ const tb=((p.bgi|0)%3+3)%3; for(let n=0;n<3&&bgi!==tb;n++) $('bgBtn').click(); mirror=p.mirror!==false; $('mirrorBtn').setAttribute('aria-pressed',mirror); } }catch(_){}
  $('bgBtn').addEventListener('click',save); $('mirrorBtn').addEventListener('click',save);
})();
</script>
